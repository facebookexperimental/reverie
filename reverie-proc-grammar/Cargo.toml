[package]
name = "reverie-proc-grammar"
description = "Pure, grammar-backed parsers and renderers for Linux /proc per-task files (stat, status, comm, fdinfo, io, sched, statm, mountinfo)."
version = "0.5.7"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/reverie-proc-grammar"
keywords = ["linux", "instrumentation", "hermit", "procfs"]
categories = ["development-tools::debugging", "os::linux-apis", "parsing"]

# The crate is a pure leaf: no non-dev dependencies at all. Everything
# below is test/example-only (quickcheck properties, the syn source
# scan in tests/purity.rs, and libc for the kernel-oracle tests).
[dev-dependencies]
libc = "0.2.186"
quickcheck = "1.1"
quickcheck_macros = "1.2.0"
syn = { version = "2", features = ["full", "visit"] }
