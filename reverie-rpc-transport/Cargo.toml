# NOTE: Hand-authored for the OSS/Cargo build. The internal Buck target and
# autocargo synchronization are a follow-up (this crate did not originate from
# Meta's internal build metadata).

[package]
name = "reverie-rpc-transport"
version = "0.4.1"
authors = ["Meta Platforms"]
edition = "2021"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/reverie-rpc-transport"
keywords = ["linux", "instrumentation", "hermit"]
categories = ["development-tools::debugging", "os::linux-apis"]
description = "Cross-process transport for the Reverie GlobalTool RPC (Unix-domain sockets + bincode). Shared by non-ptrace backends (DBT, KVM, ...) that must run GlobalState in a separate coordinator process."

[dependencies]
async-trait = "0.1.86"
bincode = { version = "2", features = ["serde"] }
libc = "0.2.186"
reverie = { version = "0.4.1", path = "../reverie", package = "reverie-core" }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["io-util", "net", "rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1.52.4", features = ["full", "test-util"] }

[[bin]]
name = "mapped_rpc_fork_fixture"
path = "tests/fixtures/mapped_rpc_fork_fixture.rs"

[features]
test-guest-log = []

[[bin]]
name = "guest_log_lifecycle_fixture"
path = "tests/fixtures/guest_log_lifecycle_fixture.rs"
