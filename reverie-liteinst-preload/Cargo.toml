[package]
name = "reverie-liteinst-preload"
version = "0.5.1"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
description = "Guest preload leaf for Reverie LiteInst"

[lib]
crate-type = ["cdylib"]

[features]
allocator-fixture = ["reverie-liteinst/allocator-fixture"]

[dependencies]
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.5.1", path = "../reverie" }
reverie-liteinst = { version = "0.5.1", path = "../reverie-liteinst", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "reverie-liteinst-glibc-compat-guest"
path = "src/bin/glibc_compat_guest.rs"
# The module's unchanged unit tests run once in this package's library. This
# executable is the non-PIE subject of the integration test below.
test = false

[[test]]
name = "glibc_compat"
path = "tests/glibc_compat.rs"
