[toolchain]
# @fb-only: path = "../../../third-party/rust-toolchain/rustup/current/basic"
# Pinned stable. The workspace builds and tests on this release; the only
# nightly-only code left is behind the off-by-default `nightly` Cargo
# features (libtest printing-macro capture in forked function guests),
# exercised by the nightly CI lane. The earlier nightly-2026-07-29 pin
# dodged a nightly-2026-07-30 cargo cdylib-uplift regression; stable cargo
# never had it (the reverie-examples liteinst tests pass on this pin).
channel = "1.97.1" # @oss-only
# Date/version pinning installs a fresh toolchain; rustup only adds clippy
# and rustfmt for it when they are requested here.
components = ["clippy", "rustfmt"] # @oss-only
