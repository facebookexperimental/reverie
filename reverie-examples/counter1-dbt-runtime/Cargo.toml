# OSS-only external caller artifact over the unchanged Counter1 Tool source.
# Keep a corresponding internal target synchronized before the next export.
[package]
name = "reverie-counter1-dbt-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "counter1_caller_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dbt]
artifact-label = "counter1"
# The shared Tool is a file in the parent examples directory. The maintained
# producer accepts directory roots and hashes this complete source closure.
input-roots = [".."]

# An independent workspace prevents parent all-features builds from unifying
# DBT's prototype exports into this explicitly produced caller image.
[workspace]
resolver = "2"

[dependencies]
reverie = { version = "0.5.4", path = "../../reverie", package = "reverie-core" }
reverie-dbt = { version = "0.5.4", path = "../../reverie-dbt", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
tracing = "0.1.41"

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
