# @generated by autocargo from //hermetic_infra/reverie/reverie-examples:[chaos,chrome-trace,chunky_print,counter1,counter2,debug,liteinst,liteinst_env_guest,noop,strace,strace_minimal]
# PR-139 adds the OSS-only LiteInst launcher, preload library, and dependencies
# here. Keep the internal target above synchronized before the next export.
# PR-151 promotes reverie-kvm from test-only coverage to the OSS example CLI
# runner. Keep the internal target above synchronized before the next export.
# PR-491 adds the parallel_tasks standalone program to the OSS Cargo build and
# validation. Keep the internal target synchronized before the next export.
# The cross-backend end-to-end check (reverie-examples/e2e/) adds the OSS-only
# recorder and reverie-e2e-compare binaries and the recorder's nix dependency.
# counter1 and counter2 select the first-party host through --backend.
# External runtime packages reuse the shared Tool and neutral host APIs.
# Keep the internal target synchronized before the next export.

[package]
name = "reverie-examples"
version = "0.5.4"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
publish = false

# The default selection preserves the existing executable/preload examples.
# Extensions select only the shared Tools with default-features=false.
[features]
default = ["runtime"]
host = []
# Explicit instrumentation for real Tool consumer tests; absent from production defaults.
test-support = []
runtime = [
    "host",
    "dep:reverie-kvm",
    "dep:reverie-liteinst",
    "dep:reverie-ptrace",
]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "chaos"
required-features = ["runtime"]
path = "chaos_launcher.rs"

[[bin]]
name = "chrome_trace"
required-features = ["runtime"]
path = "chrome-trace/launcher.rs"

[[bin]]
name = "chunky_print"
required-features = ["runtime"]
path = "chunky_print_launcher.rs"

[[bin]]
name = "counter1"
required-features = ["runtime"]
path = "counter1.rs"

[[bin]]
name = "counter2"
required-features = ["runtime"]
path = "counter2.rs"

[[bin]]
name = "debug"
required-features = ["runtime"]
path = "debug_launcher.rs"

[[bin]]
name = "noop"
required-features = ["runtime"]
path = "noop.rs"

[[bin]]
name = "parallel_tasks"
path = "../tests/standalone/parallel_tasks.rs"

[[bin]]
name = "reverie-liteinst-examples"
required-features = ["runtime"]
path = "liteinst.rs"

[[bin]]
name = "reverie-liteinst-env-guest"
required-features = ["runtime"]
path = "liteinst_env_guest.rs"

[[bin]]
name = "recorder"
required-features = ["runtime"]
path = "recorder.rs"

[[bin]]
name = "reverie-e2e-compare"
path = "e2e/compare.rs"

[[bin]]
name = "strace"
required-features = ["runtime"]
path = "strace/main.rs"

[[bin]]
name = "strace_minimal"
required-features = ["runtime"]
path = "strace_minimal_launcher.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
libc = "0.2.186"
nix = { version = "0.30.1", features = ["ptrace", "signal"] }
reverie = { version = "0.5.4", path = "../reverie", package = "reverie-core" }
reverie-kvm = { version = "0.5.4", path = "../reverie-kvm", optional = true }
reverie-liteinst = { version = "0.5.4", path = "../reverie-liteinst", default-features = false, optional = true }
reverie-ptrace = { version = "0.5.4", path = "../reverie-ptrace", optional = true }
reverie-util = { version = "0.5.4", path = "../reverie-util" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }

[dev-dependencies]
# Shared coordinator framing for the retained-configuration Strace library test.
# Keep the internal strace test dependency synchronized before the next export.
reverie-rpc-transport = { version = "0.5.4", path = "../reverie-rpc-transport" }
tempfile = "3.27.0"
