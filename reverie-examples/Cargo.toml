[package]
name = "reverie-examples"
version = "0.1.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "chaos"
path = "chaos.rs"

[[bin]]
name = "chrome_trace"
path = "chrome-trace/main.rs"

[[bin]]
name = "chunky_print"
path = "chunky_print.rs"

[[bin]]
name = "counter1"
path = "counter1.rs"

[[bin]]
name = "counter2"
path = "counter2.rs"

[[bin]]
name = "reverie-kvm-counter1"
path = "kvm_counter1.rs"

[[bin]]
name = "reverie-kvm-counter2"
path = "kvm_counter2.rs"

[[bin]]
name = "debug"
path = "debug.rs"

[[bin]]
name = "noop"
path = "noop.rs"

[[bin]]
name = "reverie-liteinst-examples"
path = "liteinst.rs"

[[bin]]
name = "reverie-liteinst-env-guest"
path = "liteinst_env_guest.rs"

[[bin]]
name = "strace"
path = "strace/main.rs"

[[bin]]
name = "strace_minimal"
path = "strace_minimal.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
libc = "0.2.186"
reverie = { version = "0.2.0", path = "../reverie", package = "reverie-core" }
reverie-e9patch = { version = "0.2.0", path = "../reverie-e9patch", default-features = false }
reverie-kvm = { version = "0.2.0", path = "../reverie-kvm" }
reverie-liteinst = { version = "0.2.0", path = "../reverie-liteinst", default-features = false }
reverie-ptrace = { version = "0.2.0", path = "../reverie-ptrace" }
reverie-util = { version = "0.2.0", path = "../reverie-util" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }

[dev-dependencies]
tempfile = "3.27.0"
