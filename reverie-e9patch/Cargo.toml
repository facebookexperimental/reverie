[package]
name = "reverie-e9patch"
description = "e9patch-based static binary-rewriting backend for the Reverie framework."
version = "0.1.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
build = "build.rs"

# Mirrors reverie-liteinst: the crate is both an rlib (for the ptrace-hosted
# backend and tests) and a cdylib (the ld-preload runtime injected into the
# guest). Only patch timing and trampoline placement differ between the two
# ld-preload backends; the injection substrate is identical.
[lib]
crate-type = ["cdylib", "rlib"]

# `preload-constructor` gates the `.init_array` entry that arms the in-guest
# runtime, exactly as in reverie-liteinst. Default-on so the cdylib self-installs
# when the loader maps it; disable it for pure-rlib consumers (e.g. the ptrace
# host and unit tests) that call `install_runtime` explicitly.
[features]
default = ["preload-constructor"]
preload-constructor = []

[dependencies]
anyhow = "1.0.103"
goblin = { version = "0.10.7", features = ["elf64"] }
libc = "0.2.186"
reverie = { version = "0.1.0", path = "../reverie", package = "reverie-core" }
reverie-preload = { version = "0.1.0", path = "../reverie-preload", default-features = false, features = ["coordinator-rpc"] }
reverie-ptrace = { version = "0.1.0", path = "../reverie-ptrace" }
reverie-rpc-transport = { version = "0.1.0", path = "../reverie-rpc-transport" }
sha2 = "0.10.9"
tempfile = "3.26.0"
tokio = { version = "1.52.4", features = ["net", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.52.4", features = ["macros", "rt"] }

[build-dependencies]
goblin = { version = "0.10.7", features = ["elf64"] }
