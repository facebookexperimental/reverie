[package]
name = "reverie-loader"
description = "Hermit's in-guest loader: validation of the fixed-address loader and runtime images, and the loader's initialization stages."
version = "0.4.1"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
publish = false

[dependencies]
libc = { version = "0.2.186", optional = true }
nix = { version = "0.30.1", features = ["fs", "process", "signal"], optional = true }
reverie-memory = { version = "0.4.1", path = "../reverie-memory", optional = true }
safeptrace = { version = "0.4.1", path = "../safeptrace", features = ["memory", "notifier"], optional = true }
serde_json = { version = "1.0.149", optional = true }

[features]
default = []
# A mechanics probe, not a product backend or a Detcore runtime.
stage1a-probe = ["dep:libc", "dep:nix", "dep:reverie-memory", "dep:safeptrace", "dep:serde_json"]

[[bin]]
name = "reverie-loader-stage1a-probe"
path = "src/bin/stage1a_probe/main.rs"
required-features = ["stage1a-probe"]
