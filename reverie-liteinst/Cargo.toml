[package]
name = "reverie-liteinst"
version = "0.4.1"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/reverie-liteinst"
keywords = ["linux", "instrumentation", "hermit"]
categories = ["development-tools::debugging", "os::linux-apis"]
description = "Experimental in-process syscall instrumentation for Reverie"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Deprecated no-op: the constructor and linker policy belong to the preload leaf.
preload-constructor = []
# Exposes a fixed test ABI in the actual runtime without changing its allocator.
allocator-fixture = ["reverie-inguest/allocator-fixture"]
# Native-exec prerequisite. Only the FullTool installation route is admitted;
# successor exec itself remains refused until its bootstrap is implemented.
fixed-syscall-gates = ["reverie-inguest/fixed-syscall-gates"]
# Private GNU loader InitialImage experiment; no successor exec admission.
exec-private-init = ["fixed-syscall-gates", "reverie-inguest/exec-private-init"]


[[bin]]
name = "reverie-liteinst-allocator-host-control"
path = "src/bin/allocator_host_control.rs"
required-features = ["allocator-fixture"]

[[bin]]
name = "reverie-liteinst-strace"
path = "src/bin/strace.rs"

[[bin]]
name = "reverie-liteinst-fork-guest"
path = "src/bin/fork_guest.rs"

[[bin]]
name = "reverie-liteinst-lifecycle-guest"
path = "src/bin/lifecycle_guest.rs"

[dependencies]
bincode = { version = "2", features = ["serde"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder"] }
libc = "0.2.186"
liteinst2 = { version = "0.1.0", git = "https://github.com/rrnewton/liteinst2", rev = "d64dc833418a4c265803645653b8f597d0f25060" }
reverie = { version = "0.4.1", path = "../reverie", package = "reverie-core" }
reverie-inguest = { version = "0.4.1", path = "../reverie-inguest", default-features = false, features = ["coordinator-rpc", "rcb-clock"] }
reverie-ptrace = { version = "0.4.1", path = "../reverie-ptrace" }
reverie-rpc-transport = { version = "0.4.1", path = "../reverie-rpc-transport" }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.52.4", features = ["macros", "net", "rt", "time"] }
tempfile = "3.27.0"
tracing = "0.1.41"

[dev-dependencies]
goblin = "=0.10.7"
safeptrace = { version = "0.4.1", path = "../safeptrace" }
sha2 = "0.10.9"
serde_json = "1"
tokio = { version = "1.52.4", features = ["test-util"] }
tracing-subscriber = "0.3.23"

[[bin]]
name = "reverie-liteinst-trap-count-guest"
path = "src/bin/trap_count_guest.rs"

[[test]]
name = "strace"
path = "tests/strace.rs"

[[test]]
name = "native_unpublished"
path = "tests/native_unpublished.rs"

[[test]]
name = "allocator_contract"
path = "tests/allocator_contract.rs"
required-features = ["allocator-fixture"]

[[test]]
name = "region_stacks"
path = "tests/region_stacks.rs"
required-features = ["allocator-fixture"]

[[test]]
name = "standalone_constructor"
path = "tests/standalone_constructor.rs"
required-features = ["allocator-fixture"]

[[test]]
name = "generic_bootstrap"
path = "tests/generic_bootstrap.rs"
required-features = ["allocator-fixture"]

[[test]]
name = "fixed_arena"
path = "tests/fixed_arena.rs"
required-features = ["allocator-fixture"]

[[test]]
name = "tool_tls"
path = "tests/tool_tls.rs"
required-features = ["allocator-fixture"]

[[bin]]
name = "reverie-liteinst-exec-guest"
path = "src/bin/exec_guest.rs"

[[bin]]
name = "reverie-liteinst-rpc-tool-guest"
path = "src/bin/rpc_tool_guest.rs"

[[bin]]
name = "reverie-liteinst-spoof-guest"
path = "src/bin/spoof_guest.rs"

[[test]]
name = "rpc_tool"
path = "tests/rpc_tool.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[bin]]
name = "reverie-liteinst-allocator-install-control"
path = "src/bin/allocator_install_control.rs"
required-features = ["allocator-fixture"]

[[bin]]
name = "reverie-liteinst-allocator-private-control"
path = "src/bin/allocator_private_control.rs"
required-features = ["allocator-fixture"]

[[test]]
name = "mapping_integrity"
path = "tests/mapping_integrity.rs"
required-features = ["allocator-fixture"]

[[test]]
name = "fixed_gates"
path = "tests/fixed_gates.rs"
required-features = ["fixed-syscall-gates"]
