[workspace]
resolver = "2"
members = [
    "experimental/nostd-print",
    "experimental/reverie-host",
    "experimental/reverie-rpc-macros",
    "experimental/reverie-rpc",
    "experimental/reverie-sabre-stats",
    "experimental/reverie-sabre-macros",
    "experimental/reverie-sabre-strace",
    "experimental/reverie-sabre",
    "experimental/riptrace",
    "experimental/riptrace/rpc",
    "experimental/riptrace/tool",
    "reverie",
    "reverie-dbt",
    "reverie-inguest",
    "reverie-e9patch",
    "reverie-examples",
    "reverie-kvm",
    "reverie-kvm-core",
    "reverie-linux-provider",
    "reverie-linuxemu",
    "reverie-liteinst",
    "reverie-liteinst-artifact",
    "reverie-liteinst-preload",
    "reverie-loader",
    "reverie-memory",
    "reverie-process",
    "reverie-ptrace",
    "reverie-rpc-transport",
    "reverie-syscalls",
    "reverie-test-support",
    "reverie-util",
    "safeptrace",
]
# The caller cdylib has an independent lock and mandatory explicit producer.
# Workspace all-features must not unify its dependency with prototype exports.
# Keep the separate caller target/gates synchronized in internal exports.
exclude = [
    "public_autocargo/experimental",
    "reverie-examples/strace-dbt-runtime",
    "reverie-examples/counter1-dbt-runtime",
    "reverie-dbt/tests/fixtures/caller-lifecycle-runtime",
]
