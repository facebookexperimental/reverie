# OSS-only native test caller. Keep the corresponding internal target synchronized.
[package]
name = "reverie-dbt-caller-lifecycle-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "caller_lifecycle_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dbt]
artifact-label = "caller-lifecycle"
input-roots = []

# A parent all-features build must not unify prototype exports into this DSO.
# The explicit producer and standalone quality gates remain mandatory.
[workspace]
resolver = "2"

[dependencies]
reverie = { version = "0.5.4", path = "../../../../reverie", package = "reverie-core" }
reverie-dbt = { version = "0.5.4", path = "../../..", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
