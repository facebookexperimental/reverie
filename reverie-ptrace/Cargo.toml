# @generated by autocargo from //hermetic_infra/reverie:reverie-ptrace

[package]
name = "reverie-ptrace"
description = "ptrace-based execution backend for the Reverie instrumentation framework."
version = "0.4.1"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
build = "build.rs"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/reverie-ptrace"
keywords = ["linux", "instrumentation", "hermit"]
categories = ["development-tools::debugging", "os::linux-apis"]

[features]
default = []
# Clear libtest's thread-local stdout/stderr capture in forked function guests.
# Normal subprocess execution and descriptor-based capture use stable Rust.
nightly = []

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.86"
bincode = { version = "2", features = ["serde"] }
bytes = { version = "1.12.1", features = ["serde"] }
close-err = "1.0.2"
futures = { version = "0.3.31", features = ["async-await", "compat"] }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
# Exactly 1.21.0: liteinst_census.rs works around its 4 GiB overflow panic, and
# its test one_decoder_panics_on_an_instruction_ending_at_4_gib fails once a
# release fixes it. Bump deliberately: https://github.com/rrnewton/reverie/issues/858
iced-x86 = "=1.21.0"
libc = "0.2.186"
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
num-traits = { version = "0.2.19", default-features = false }
paste = "1.0.14"
perf-event-open-sys = "5.0"
procfs = "0.18.0"
raw-cpuid = "10.7.0"
reverie = { version = "0.4.1", path = "../reverie", package = "reverie-core" }
safeptrace = { version = "0.4.1", path = "../safeptrace", features = ["memory", "notifier"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tokio-stream = { version = "0.1.18", features = ["fs", "io-util", "net", "signal", "sync", "time"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }
unwind = { version = "0.4.2", features = ["ptrace"] }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
test-case = "3.3.1"
