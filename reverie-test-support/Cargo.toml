# Hand-maintained alongside the generic conformance targets in BUCK.
# Keep the dependencies and integration registrations synchronized.

[package]
name = "reverie-test-support"
description = "Command helpers for generic Reverie conformance tests."
version = "0.5.7"
authors = ["Meta Platforms"]
edition = "2024"
license = "BSD-2-Clause"
publish = false

[features]
# Enables reverie-ptrace's nightly libtest-capture clearing so the
# function-guest printing-macro half of `run_guest_func_print_test` runs.
# Needs a nightly compiler; exercised by the nightly CI lane.
nightly = ["reverie-ptrace/nightly"]

[dependencies]
libc = "0.2.186"
syscalls = "0.8.1"
nix = { version = "0.30.1", features = ["fs", "process", "signal"] }
reverie = { version = "0.5.7", path = "../reverie", package = "reverie-core" }
reverie-ptrace = { version = "0.5.7", path = "../reverie-ptrace" }

[dev-dependencies]
close-err = "1.0.2"
# No `nightly` feature here: the workspace builds and tests on stable Rust.
# Function guests that print with std macros rely on descriptor writes or an
# uncaptured test runner, as `spawn_fn_with_config` documents; the nightly
# printing-macro capture case runs in the nightly CI lane.
reverie-ptrace = { version = "0.5.7", path = "../reverie-ptrace" }
serde = { version = "1.0.219", features = ["derive"] }
tempfile = "3.27.0"
tracing = "0.1.41"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sanitized)"] }

[[test]]
name = "basics"
path = "../tests/basics.rs"

[[test]]
name = "exit"
path = "../tests/exit.rs"

[[test]]
name = "stat"
path = "../tests/stat.rs"

[[test]]
name = "vdso"
path = "../tests/vdso.rs"

[[test]]
name = "inject_then_tail"
path = "../tests/inject_then_tail.rs"

[[test]]
name = "at_random"
path = "../tests/at_random.rs"

[[test]]
name = "initial_stack_pointer"
path = "../tests/initial_stack_pointer.rs"

[[test]]
name = "thread_start"
path = "../tests/thread_start.rs"

[[test]]
name = "stack"
path = "../tests/stack.rs"

[[test]]
name = "suppression"
path = "../tests/suppression.rs"

# Guest names use '_', never '-': tests/BUCK sets each CARGO_BIN_EXE_<name>
# in the test's run-time environment too, and remote execution refuses
# environment variable names that contain '-'.
[[bin]]
name = "stat_rust_command_guest"
path = "../tests/fixtures/stat-rust-command.rs"
test = false
bench = false

[[bin]]
name = "exit_rust_command_guest"
path = "../tests/fixtures/exit-rust-command.rs"
test = false
bench = false

[[bin]]
name = "basics_rust_command_guest"
path = "../tests/fixtures/basics-rust-command.rs"
test = false
bench = false

[[bin]]
name = "vdso_rust_command_guest"
path = "../tests/fixtures/vdso-rust-command.rs"
test = false
