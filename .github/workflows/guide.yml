name: Guide

# Builds the mdBook guide in guide/ and, on main, deploys it to GitHub
# Pages. Kept separate from ci.yml: hosted runners only, no secrets,
# no self-hosted hardware.
#
# Deployment is a NO-OP until GitHub Pages is enabled for this repo
# (Settings -> Pages -> Source: "GitHub Actions", a repo-admin/owner
# decision) AND the repo variable PAGES_ENABLED is set to "true". The
# build job runs whenever ci.yml's PR gating admits the run (draft and
# hermit-bot3 PRs are skipped, matching base policy); upload/deploy are
# skipped while unenabled, so this workflow can merge before Pages
# exists. On push to main with the variable unset, the build job runs
# green and upload/deploy are SKIPPED: nothing is published and no repo
# setting is touched (deploy-pages never executes, and it cannot
# enable Pages itself).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guide
    if: github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'hermit-bot3' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MDBOOK_VERSION: "0.4.52"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: Fetch mdBook
        env:
          MDBOOK_SHA256: "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768"
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSL --max-time 120 -o "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build guide
        run: mdbook build guide
      - name: Test guide snippets
        run: mdbook test guide
      - name: Check under-construction count matches the front page
        run: |
          counted=$(grep -r --count '<!-- UC:' guide/src | awk -F: '{s+=$2} END {print s}')
          stated=$(grep -o 'Under-construction regions in this guide: [0-9]*' guide/src/introduction.md | grep -o '[0-9]*$')
          echo "counted=$counted stated=$stated"
          [ "$counted" = "$stated" ]
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version
      - name: Dependencies
        # Same step as ci.yml: cargo doc runs build scripts (unwind-sys
        # needs libunwind via pkg-config), so the doc step needs these.
        # Refresh the index first: the runner image's index can name package
        # versions the mirror no longer serves, and install then fails with 404.
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev
      - name: API docs (workspace, no deps, warnings denied)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          source scripts/stable-features.sh
          cargo doc --workspace --features "${STABLE_FEATURES}" --no-deps
      - name: Upload Pages artifact
        if: vars.PAGES_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: guide/book

  deploy:
    name: Deploy to GitHub Pages
    # Never cancel a deploy mid-flight (the workflow-level group cancels builds).
    concurrency:
      group: guide-deploy-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    if: vars.PAGES_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
