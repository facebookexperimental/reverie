name: Rust

# Owner decision, 2026-10-27: run CI automatically only for pull requests not
# opened by the project bot (hermit-bot3). The hosted `regular` job runs for
# such a pull request once it is out of draft, from a branch or a fork; it uses
# no secrets and the read-only token below. The self-hosted `hardware` job runs
# for a pull request only when the owner opened it, its head branch is in this
# repository (not a fork), and it is not a draft: a third party's code must not
# run unreviewed on the PMU hosts, and an owner-opened pull request from someone
# else's fork would otherwise run every later push from that fork there.
# The producer-only `allocator-fixtures` job is deliberately broader: it
# runs on every non-draft pull request, bot-authored included, because the
# allocator-fixture producer otherwise went dark while its compiled cohort
# drifted. It is hosted, uses no secrets, and is best-effort signal only:
# local validation (`validate.sh`, which hard-fails on a producer refusal)
# and its ledger remain the gate; no GitHub check is a required status check.
# Every push to main also runs the hosted jobs (owner, 2026-11-12), for
# post-merge signal on the exported main tip. The self-hosted `hardware` job
# keeps its earlier triggers and never runs for a push.
#
# Reduced push/PR lane: this file's hosted `regular` job runs no tests. It
# keeps the build, the locked-dependency fetch, the skill-discovery check and
# the LiteInst allocator fixture build, which pass reliably on hosted runners,
# so it is named "Build (GitHub-hosted)"; merge-gate.yml selects it by that
# name and reports it as build-only. Its job id stays `regular`. The full
# workspace test suite, documentation tests, Clippy, formatting and the
# API-docs build moved to the manual/scheduled Extended checks workflow
# (extended.yml), unchanged. The no-device cross-backend check runs in
# e2e-compare.yml, judged against a ledger; `regular` checks that
# workflow's pin (scripts/check-e2e-compare.rs). The KVM cross-backend check
# runs in `hardware` by its earlier rule (judged where a ledger exists for the
# runner's environment, report-only where none does), and never reports
# without judging in the dispatch-only self-hosted `kvm-e2e` job below.
# GitHub CI is best-effort signal only; local validation (validate.sh)
# remains the real testing, and no GitHub check is a required status
# check.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# One run per pull request: a newer push cancels the older run, so pushes do
# not queue up on the small self-hosted pool. Dispatches keep their own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-llzma

jobs:
  regular:
    name: Build (GitHub-hosted)
    if: github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'hermit-bot3' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Dependencies
      # Refresh the index first: the runner image's index can name package
      # versions the mirror no longer serves, and install then fails with 404.
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev
    - name: Rust toolchain
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        rustup toolchain install "$channel" --profile minimal
        rustc --version
    - name: Cross-client skill discovery
      run: |
        rustc scripts/check-skill-discovery.rs -o "$RUNNER_TEMP/check-skill-discovery"
        "$RUNNER_TEMP/check-skill-discovery"
    - name: E2E compare workflow pin
      run: |
        rustc --edition 2021 scripts/check-e2e-compare.rs -o "$RUNNER_TEMP/check-e2e-compare"
        "$RUNNER_TEMP/check-e2e-compare" --self-test
        "$RUNNER_TEMP/check-e2e-compare" .
    - name: Build
      run: |
        source scripts/stable-features.sh
        cargo build --workspace --features "${STABLE_FEATURES}"
    - name: Fetch locked dependencies
      run: cargo fetch --locked
    - name: LiteInst allocator fixtures
      timeout-minutes: 10
      run: |
        set -euo pipefail
        cargo install --locked rust-script
        generation="$RUNNER_TEMP/liteinst-allocator-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        scripts/build-liteinst-test-runtime.rs --for-ci "$generation"
        cat "$generation/bundle/github.env" >> "$GITHUB_ENV"
    - name: Upload LiteInst allocator producer logs
      # Keep the producer's per-command logs when the step fails; they are the
      # only record of the failing command's own output.
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: liteinst-allocator-logs-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/liteinst-allocator-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}/bundle/logs
        if-no-files-found: warn
        retention-days: 3

  allocator-fixtures:
    name: LiteInst allocator fixtures (producer)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev
    - name: Rust toolchain
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        rustup toolchain install "$channel" --profile minimal
        rustc --version
    - name: Fetch locked dependencies
      run: cargo fetch --locked
    - name: LiteInst allocator fixtures (producer)
      timeout-minutes: 20
      run: |
        set -euo pipefail
        cargo install --locked rust-script
        generation="$RUNNER_TEMP/liteinst-allocator-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        scripts/build-liteinst-test-runtime.rs --for-ci "$generation"

  hardware:
    name: Host-dependent tests (self-hosted)
    if: >-
      ${{
        vars.REVERIE_SELF_HOSTED == 'true' &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            (
              github.actor == 'rrnewton' ||
              (
                github.actor == 'rrnewton-bots' &&
                github.triggering_actor == 'rrnewton-bots' &&
                github.repository == 'rrnewton/reverie' &&
                github.ref_name == github.event.repository.default_branch &&
                github.ref_protected == true
              )
            )
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.user.login == 'rrnewton' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft
          )
        )
      }}
    runs-on: [self-hosted, Linux, X64, reverie]
    # AGGRESSIVE 10-minute box on scarce self-hosted hardware. The self-hosted
    # `reverie` pool is small and shared (observed peak ~4 simultaneous jobs on
    # one physical host), so a single long job consumes a large fraction of total
    # capacity for its whole duration; the timeout is RESOURCE PROTECTION, not
    # merely a hang detector. It is also the enforcement of "short tests only" on
    # this hardware: the host-dependent test baseline is ~2 minutes, so 10 is
    # already ~5x headroom, while the job silently wedged at 2h44m (~80x) once and
    # squatted the runner. A silent hang and a merely-slow job are
    # indistinguishable without a bound; 10 min converts either into a fast,
    # definite signal ("re-run on a quiesced runner").
    #
    # This 10-minute budget assumes the WARM self-hosted cache (incremental build
    # + ~2min tests) that is the steady state on a persistent runner. A COLD
    # A workspace build can exceed 10 min; per policy that overflow is a
    # surfaced FINDING, not a reason to pre-emptively raise the bound -- the
    # informative watchdog below attributes exactly which step overran and for how
    # long, so a cold-build overflow is diagnosable rather than a bare timeout.
    timeout-minutes: 10

    steps:
    # PMU-sensitive tests measure hardware counters whose behaviour changes when
    # the machine is busy: a measurement taken under host contention is INVALID
    # and must be discarded, not reported (same principle as the nightly stress
    # harness validity calibrator). Refuse fast and honestly rather than degrade
    # into a multi-hour hang. Runs first, before build/test, so it reflects
    # AMBIENT load (neighbour/fleet), not this job's own build parallelism.
    - name: Host load precondition (PMU measurement validity)
      env:
        MAX_LOAD_PER_CORE: ${{ vars.REVERIE_MAX_LOAD_PER_CORE || '1.5' }}
        SKIP_LOAD_PRECONDITION: ${{ vars.REVERIE_SKIP_LOAD_PRECONDITION }}
      run: |
        set -euo pipefail
        if [ "${SKIP_LOAD_PRECONDITION:-}" = "true" ]; then
          echo "REVERIE_SKIP_LOAD_PRECONDITION=true -> skipping host-load precondition."
          exit 0
        fi
        read -r load1 _ < /proc/loadavg
        cores="$(nproc)"
        limit="$(awk -v c="$cores" -v m="$MAX_LOAD_PER_CORE" 'BEGIN { printf "%.2f", c * m }')"
        echo "host 1m-load=$load1 cores=$cores max-per-core=$MAX_LOAD_PER_CORE limit=$limit"
        over="$(awk -v l="$load1" -v lim="$limit" 'BEGIN { print (l > lim) ? 1 : 0 }')"
        if [ "$over" = "1" ]; then
          echo "::error title=Host too loaded to measure (not a product failure)::1-minute load average ${load1} exceeds ${limit} (${cores} cores x ${MAX_LOAD_PER_CORE}). PMU/perf-counter determinism tests cannot be measured validly on a contended host, so this run is refused rather than reporting an invalid measurement. This is NOT a Reverie regression. Remedies: re-run on a quiesced host, add a second 'reverie' self-hosted runner (removes the SPOF), raise vars.REVERIE_MAX_LOAD_PER_CORE, or set vars.REVERIE_SKIP_LOAD_PRECONDITION=true to opt out."
          exit 1
        fi
        echo "Host load within budget; proceeding with host-dependent tests."
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Dependencies
      run: |
        # Detect the native package manager dnf-FIRST: the Fedora self-hosted
        # runners also have apt-get on PATH, but its repos lack cmake/zlib1g-dev,
        # so keying on `command -v apt-get` took the apt branch and failed with
        # "Unable to locate package cmake" (exit 100). dnf-first routes each
        # distro to its own manager.
        if command -v dnf >/dev/null; then
          sudo dnf install -y libunwind-devel xz-devel cmake zlib-devel
        elif command -v apt-get >/dev/null; then
          sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev
        fi
    - name: Rust toolchain
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        rustup toolchain install "$channel" --profile minimal
        rustc --version
    - name: Build
      run: |
        source scripts/stable-features.sh
        cargo build --workspace --features "${STABLE_FEATURES}"
    - name: LiteInst allocator fixtures
      timeout-minutes: 10
      run: |
        set -euo pipefail
        cargo install --locked rust-script
        generation="$RUNNER_TEMP/liteinst-allocator-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        scripts/build-liteinst-test-runtime.rs --for-ci "$generation"
        cat "$generation/bundle/github.env" >> "$GITHUB_ENV"
    - name: Host-dependent workspace tests
      env:
        REVERIE_REQUIRE_KVM: "1"
      run: |
        # Informative timeout: this step is the known wedge site (the 2h44m hang
        # lived here). The job is hard-boxed at timeout-minutes:10, but a bare
        # GitHub job timeout says only "job cancelled" -- not which step, for how
        # long, or whether it was a genuine hang vs host-load starvation. Launch a
        # background watchdog that, ~1-2 min before the hard box, prints this step
        # + elapsed + two live thread/wchan snapshots of the test tree. It never
        # fails the build (timeout-minutes stays the enforcement); on the green
        # path the test finishes first and the watchdog is killed mid-sleep,
        # costing nothing.
        scripts/ci-timeout-watchdog.sh \
          --step "Host-dependent workspace tests" \
          --soft-deadline 300 --hard-box 540 &
        watchdog=$!
        set +e
        source scripts/stable-features.sh
        cargo test --workspace --features "${STABLE_FEATURES}" -- --test-threads=1
        status=$?
        kill "$watchdog" 2>/dev/null || true
        wait "$watchdog" 2>/dev/null || true
        exit "$status"
    # The cross-backend check on KVM, by the rule this job ran it under before
    # run.sh failed closed: judged where a ledger exists for this runner's
    # environment, reported without judgment where none does (NO LEDGER ...:
    # report only), via --report-only-if-no-ledger (reverie-examples/e2e/README.md).
    # It builds the e2e binaries and needs /dev/kvm; without it the run exits 1
    # by name ("no requested backend can run on this host"). The run that never
    # reports without judging is the dispatch-only `kvm-e2e` job below.
    - name: Reverie-layer cross-backend e2e (KVM)
      run: reverie-examples/e2e/run.sh --backends kvm --report-only-if-no-ledger

  kvm-e2e:
    name: KVM cross-backend e2e (self-hosted)
    # The cross-backend check on KVM, which needs /dev/kvm, judged against the
    # ledger for the runner's environment (reverie-examples/e2e/README.md).
    # `hardware` keeps the same check by its earlier rule (judged where a
    # ledger exists, report-only where none does); this job never reports
    # without judging. Privileged self-hosted work, so dispatch-only,
    # with `hardware`'s dispatch clause. Until a ledger for the runner host,
    # kernel and package set lands, it fails by name (NO LEDGER) and uploads
    # the rows it measured. Where kvm is refused, the run exits 1 by name
    # ("no requested backend can run on this host") before the comparator
    # runs, so no rows are measured.
    if: >-
      ${{
        vars.REVERIE_SELF_HOSTED == 'true' &&
        github.event_name == 'workflow_dispatch' &&
        (
          github.actor == 'rrnewton' ||
          (
            github.actor == 'rrnewton-bots' &&
            github.triggering_actor == 'rrnewton-bots' &&
            github.repository == 'rrnewton/reverie' &&
            github.ref_name == github.event.repository.default_branch &&
            github.ref_protected == true
          )
        )
      }}
    runs-on: [self-hosted, Linux, X64, reverie]
    # `hardware`'s 10-minute box: resource protection on the small shared
    # pool. The comparison is bounded at 8 so the rows upload still runs
    # after a timeout. The steps before it are not bounded one by one; the
    # first dispatch measures them (a cold build overruns, as for
    # `hardware`).
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Dependencies
      run: |
        # dnf first: the Fedora self-hosted runners also have apt-get on PATH
        # (see `hardware`).
        if command -v dnf >/dev/null; then
          sudo dnf install -y libunwind-devel xz-devel cmake zlib-devel
        elif command -v apt-get >/dev/null; then
          sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev
        fi
    - name: Rust toolchain
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        rustup toolchain install "$channel" --profile minimal
        rustc --version
    - name: KVM cross-backend e2e
      timeout-minutes: 8
      run: reverie-examples/e2e/run.sh --backends kvm --require-compared kvm --write-ledger "$RUNNER_TEMP/e2e-kvm-rows.tsv"
    - name: Upload measured KVM rows
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-kvm-rows-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/e2e-kvm-rows.tsv
        if-no-files-found: warn
        retention-days: 3
