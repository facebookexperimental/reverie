name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to re-evaluate. Dispatch this workflow with ref set to the
          pull request's head branch so the check attaches to its head SHA.
        required: true
        type: string

# This lightweight required check accepts an exact PR head only after the
# repository CI workflow succeeds. Local Reverie validation has no remotely
# dereferenceable receipt authority yet, so a bare locally-validated label is
# never landing evidence. Merge-group checks inspect their constituent PR heads
# instead of trusting the synthetic queue commit.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  refire-on-ci-completion:
    name: refire-on-ci-completion
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-dispatch the gate for a completed PR CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            gh-readonly-queue/*)
              echo "Merge-group events evaluate queue commits directly."
              exit 0
              ;;
          esac

          owner="${REPO%%/*}"
          matches="$(
            gh api "repos/${REPO}/pulls?state=open&base=main&head=${owner}:${HEAD_BRANCH}&per_page=10" |
              jq -c --arg sha "$HEAD_SHA" 'map({number, current: (.head.sha == $sha)})'
          )"

          while IFS=$'\t' read -r pr_number current; do
            if [ "$current" != "true" ]; then
              echo "PR #${pr_number} advanced beyond $HEAD_SHA; its newer CI run will re-fire the gate."
              continue
            fi
            gh workflow run merge-gate.yml \
              --repo "$REPO" \
              --ref "$HEAD_BRANCH" \
              -f pr_number="$pr_number"
          done < <(jq -r '.[] | [.number, .current] | @tsv' <<< "$matches")

  invalidate-local-validation:
    name: invalidate-local-validation
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove validation inherited from an older PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if grep -Fxq locally-validated <<< "$labels"; then
            gh api --method DELETE \
              "repos/${REPO}/issues/${PR_NUMBER}/labels/locally-validated" \
              --silent
            echo "Removed stale locally-validated label from PR #$PR_NUMBER."
          fi

  merge-gate:
    name: merge-gate
    needs: [invalidate-local-validation]
    if: always() && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted gate policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out canonical CI authority
        uses: actions/checkout@v4
        with:
          repository: rrnewton/dev-hermit
          ref: 173d87688483189154cdd44feb031347a737e29a
          path: .dev-hermit-policy
          persist-credentials: false
      - name: Require PASSED CI or re-dispatch NO_RESULT
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          GATE_RUN_ID: ${{ github.run_id }}
          INVALIDATION_RESULT: ${{ needs.invalidate-local-validation.result }}
          PR_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          classify_check() {
            python3 .dev-hermit-policy/ci-hub/check_outcome.py \
              --status "$1" --conclusion "$2"
          }

          [ "$(classify_check completed success)" = PASSED ]
          [ "$(classify_check "" success)" = PASSED ]
          for conclusion in failure timed_out error startup_failure; do
            [ "$(classify_check completed "$conclusion")" = FAILED ]
          done
          for state in \
            completed:cancelled completed:skipped completed:neutral \
            completed:stale completed:action_required queued:none \
            in_progress:none waiting:none requested:none missing:none \
            completed:future_state; do
            status=${state%%:*}
            conclusion=${state#*:}
            [ "$conclusion" != none ] || conclusion=
            [ "$(classify_check "$status" "$conclusion")" = NO_RESULT ]
          done
          echo "Required-check predicate: N=2 PASSED, N=4 FAILED, N=11 NO_RESULT."

          dispatch_file="${RUNNER_TEMP:-/tmp}/reverie-gate-redispatch-${GATE_RUN_ID}.tsv"
          : >"$dispatch_file"
          no_result=0

          queue_dispatch() {
            local head_ref=$1 head_repo=$2 pr_number=$3 head_sha=$4
            no_result=1
            if [ "$head_repo" != "$REPO" ]; then
              echo "::warning::NO_RESULT for PR #$pr_number at $head_sha cannot be dispatched from external repository $head_repo."
              return
            fi
            printf '%s\t%s\t%s\n' "$head_ref" "$pr_number" "$head_sha" >>"$dispatch_file"
          }

          dispatch_no_result() {
            sort -u "$dispatch_file" | while IFS=$'\t' read -r head_ref pr_number head_sha; do
              [ -n "$head_ref" ] || continue
              echo "NO_RESULT: re-dispatching ci.yml for PR #$pr_number at $head_sha (ref=$head_ref)."
              gh workflow run ci.yml --repo "$REPO" --ref "$head_ref"
            done
          }

          cancel_no_result_gate() {
            echo "NO_RESULT blocks landing but is not a failure; cancelling gate run $GATE_RUN_ID after re-dispatch."
            gh api --method POST \
              "repos/${REPO}/actions/runs/${GATE_RUN_ID}/force-cancel" --silent
            for _ in {1..60}; do sleep 5; done
            echo "::error::Gate cancellation request did not terminate run $GATE_RUN_ID."
            exit 1
          }

          if [ "$EVENT_NAME" = pull_request ] && [ "$PR_ACTION" = synchronize ]; then
            invalidation_state=$(classify_check "" "$INVALIDATION_RESULT")
            case "$invalidation_state" in
              PASSED) ;;
              FAILED)
                echo "::error::Could not invalidate local validation from the previous PR head."
                exit 1
                ;;
              NO_RESULT)
                echo "Local-validation invalidation has NO_RESULT; local labels are not admission evidence."
                ;;
            esac
          fi

          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = null ]; then
              echo "::error::workflow_dispatch requires a pr_number input."
              exit 1
            fi
            pull_requests="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" | jq -c '
              [select(.base.ref == "main") | {
                number,
                head: {sha: .head.sha, ref: .head.ref, repo: .head.repo.full_name}
              }]
            ')"
          else
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            base_branch="${BASE_REF#refs/heads/}"
            pull_requests="$(
              gh api graphql \
                -f owner="$owner" \
                -f name="$name" \
                -f branch="$base_branch" \
                -f query='query($owner: String!, $name: String!, $branch: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: $branch) {
                    entries(first: 100) {
                      nodes {
                        headCommit { oid }
                        pullRequest {
                          number
                          headRefOid
                          headRefName
                          headRepository { nameWithOwner }
                          baseRefName
                        }
                      }
                    }
                  }
                }
              }' | jq -c --arg sha "$SHA" --arg base "$base_branch" '
                .data.repository.mergeQueue.entries.nodes
                | map(select(
                    .headCommit.oid == $sha
                    and .pullRequest.baseRefName == $base
                  ) | {
                    number: .pullRequest.number,
                    head: {
                      sha: .pullRequest.headRefOid,
                      ref: .pullRequest.headRefName,
                      repo: .pullRequest.headRepository.nameWithOwner
                    }
                  })
              ')"
          fi

          if [ "$(jq 'length' <<< "$pull_requests")" -eq 0 ]; then
            echo "::error::No main-branch pull request is associated with $SHA."
            exit 1
          fi

          failed=0
          while IFS=$'\t' read -r pr_number head_sha head_ref head_repo; do
            if [ -z "$head_sha" ] || [ "$head_sha" = null ]; then
              echo "::error::PR #${pr_number} has no head SHA."
              failed=1
              continue
            fi
            runs="$(
              gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&per_page=100"
            )"
            run="$(python3 .dev-hermit-policy/ci-hub/check_outcome.py \
              --select-latest-run --head-sha "$head_sha" <<< "$runs")"
            status="$(jq -r '.status // "missing"' <<< "$run")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            url="$(jq -r '.html_url // ""' <<< "$run")"

            outcome=$(classify_check "$status" "$conclusion")
            case "$outcome" in
              PASSED)
                echo "CI PASSED for PR #${pr_number} at $head_sha: $url"
                ;;
              FAILED)
                echo "::error::CI FAILED for PR #${pr_number} at $head_sha ($status/${conclusion:-none}): ${url:-no run URL}."
                failed=1
                ;;
              NO_RESULT)
                echo "CI has NO_RESULT for PR #${pr_number} at $head_sha ($status/${conclusion:-none}); blocking without reporting failure."
                queue_dispatch "$head_ref" "$head_repo" "$pr_number" "$head_sha"
                ;;
            esac
          done < <(jq -r '
            .[]
            | [.number, .head.sha, .head.ref, .head.repo]
            | @tsv
          ' <<< "$pull_requests")

          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi
          if [ "$no_result" -ne 0 ]; then
            dispatch_no_result
            cancel_no_result_gate
          fi

          echo "Every required leg has a PASSED result."
