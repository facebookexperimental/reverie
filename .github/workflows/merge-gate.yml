name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to re-evaluate. Dispatch this workflow with ref set to the
          pull request's head branch so the check attaches to its head SHA.
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA to evaluate and attach this gate to.
        required: true
        type: string

# Gate semantics version: v2. The required status context is `merge-gate-v2`.
# `REVERIE_MERGE_GATE_V2_BLOB` binds every authorizing run to the registered
# workflow definition, so an old PR cannot satisfy current protection with its
# own weaker branch-local YAML. The legacy `merge-gate` context exists only
# during the fail-closed overlap migration.
#
# This lightweight required check accepts an exact PR head only after the
# repository CI workflow succeeds. Local Reverie validation has no remotely
# dereferenceable receipt authority yet, so a bare locally-validated label is
# never landing evidence. Merge-group checks inspect their constituent PR heads
# instead of trusting the synthetic queue commit.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  refire-on-ci-completion:
    name: refire-on-ci-completion
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-dispatch the gate for a completed PR CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            gh-readonly-queue/*)
              echo "Merge-group events evaluate queue commits directly."
              exit 0
              ;;
          esac

          owner="${REPO%%/*}"
          matches="$(
            gh api "repos/${REPO}/pulls?state=open&base=main&head=${owner}:${HEAD_BRANCH}&per_page=10" |
              jq -c --arg sha "$HEAD_SHA" 'map({number, current: (.head.sha == $sha)})'
          )"

          while IFS=$'\t' read -r pr_number current; do
            if [ "$current" != "true" ]; then
              echo "PR #${pr_number} advanced beyond $HEAD_SHA; its newer CI run will re-fire the gate."
              continue
            fi
            gh workflow run merge-gate.yml \
              --repo "$REPO" \
              --ref "$HEAD_BRANCH" \
              -f pr_number="$pr_number" \
              -f head_sha="$HEAD_SHA"
          done < <(jq -r '.[] | [.number, .current] | @tsv' <<< "$matches")

  invalidate-local-validation:
    name: invalidate-local-validation
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove validation inherited from an older PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if grep -Fxq locally-validated <<< "$labels"; then
            gh api --method DELETE \
              "repos/${REPO}/issues/${PR_NUMBER}/labels/locally-validated" \
              --silent
            echo "Removed stale locally-validated label from PR #$PR_NUMBER."
          fi

  merge-gate:
    name: merge-gate-v2
    needs: [invalidate-local-validation]
    if: always() && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Require the registered v2 gate definition
        env:
          EXPECTED_GATE_BLOB: ${{ vars.REVERIE_MERGE_GATE_V2_BLOB }}
          GATE_PATH: .github/workflows/merge-gate.yml
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_GATE_BLOB" ]; then
            echo "::error::REVERIE_MERGE_GATE_V2_BLOB is not configured; refusing an unbound gate result."
            exit 1
          fi
          actual_blob="$(
            gh api "repos/${REPO}/contents/${GATE_PATH}?ref=${SHA}" --jq .sha
          )"
          if [ "$actual_blob" != "$EXPECTED_GATE_BLOB" ]; then
            echo "::error::Gate definition mismatch: run used ${actual_blob}, registered v2 is ${EXPECTED_GATE_BLOB}. Rebase onto current main; a branch-owned gate cannot authorize itself."
            exit 1
          fi
          echo "Gate definition is registered v2 blob ${actual_blob}."
      - name: Check out trusted gate policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out canonical CI authority
        uses: actions/checkout@v4
        with:
          repository: rrnewton/dev-hermit
          ref: 4b78d727f35bc8612ac460a6e270dda5f5df304c
          path: .dev-hermit-policy
          persist-credentials: false
      - name: Require PASSED CI or re-dispatch NO_RESULT
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          GATE_RUN_ID: ${{ github.run_id }}
          INVALIDATION_RESULT: ${{ needs.invalidate-local-validation.result }}
          PR_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          classify_check() {
            python3 .dev-hermit-policy/ci-hub/check_outcome.py \
              --status "$1" --conclusion "$2"
          }

          [ "$(classify_check completed success)" = PASSED ]
          [ "$(classify_check "" success)" = PASSED ]
          for conclusion in failure timed_out error startup_failure; do
            [ "$(classify_check completed "$conclusion")" = FAILED ]
          done
          for state in \
            completed:cancelled completed:skipped completed:neutral \
            completed:stale completed:action_required queued:none \
            in_progress:none waiting:none requested:none missing:none \
            completed:future_state; do
            status=${state%%:*}
            conclusion=${state#*:}
            [ "$conclusion" != none ] || conclusion=
            [ "$(classify_check "$status" "$conclusion")" = NO_RESULT ]
          done
          echo "Required-check predicate: N=2 PASSED, N=4 FAILED, N=11 NO_RESULT."

          dispatch_file="${RUNNER_TEMP:-/tmp}/reverie-gate-redispatch-${GATE_RUN_ID}.tsv"
          : >"$dispatch_file"
          no_result=0

          queue_retry() {
            local run_status=$1 run_id=$2 pr_number=$3 head_sha=$4
            no_result=1
            case "$run_status" in
              queued | in_progress | waiting | requested | pending)
                echo "NO_RESULT for PR #$pr_number at $head_sha is still active ($run_status); completion will refire the gate."
                ;;
              *)
                if [ -z "$run_id" ]; then
                  echo "::warning::NO_RESULT for PR #$pr_number at $head_sha has no pull-request run to rerun."
                else
                  printf '%s\t%s\t%s\n' "$run_id" "$pr_number" "$head_sha" >>"$dispatch_file"
                fi
                ;;
            esac
          }

          dispatch_no_result() {
            sort -u "$dispatch_file" | while IFS=$'\t' read -r run_id pr_number head_sha; do
              [ -n "$run_id" ] || continue
              echo "NO_RESULT: rerunning pull-request CI run $run_id for PR #$pr_number at $head_sha."
              gh api --method POST \
                "repos/${REPO}/actions/runs/${run_id}/rerun" --silent
            done
          }

          cancel_no_result_gate() {
            echo "NO_RESULT blocks landing but is not a failure; cancelling gate run $GATE_RUN_ID after re-dispatch."
            gh api --method POST \
              "repos/${REPO}/actions/runs/${GATE_RUN_ID}/force-cancel" --silent
            for _ in {1..60}; do sleep 5; done
            echo "::error::Gate cancellation request did not terminate run $GATE_RUN_ID."
            exit 1
          }

          if [ "$EVENT_NAME" = pull_request ] && [ "$PR_ACTION" = synchronize ]; then
            invalidation_state=$(classify_check "" "$INVALIDATION_RESULT")
            case "$invalidation_state" in
              PASSED) ;;
              FAILED)
                echo "::error::Could not invalidate local validation from the previous PR head."
                exit 1
                ;;
              NO_RESULT)
                echo "Local-validation invalidation has NO_RESULT; local labels are not admission evidence."
                ;;
            esac
          fi

          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = null ]; then
              echo "::error::workflow_dispatch requires a pr_number input."
              exit 1
            fi
            if [ -z "$EXPECTED_HEAD_SHA" ] ||
               { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$SHA" != "$EXPECTED_HEAD_SHA" ]; }; then
              echo "::error::Gate run SHA $SHA does not match requested PR head ${EXPECTED_HEAD_SHA:-missing}."
              exit 1
            fi
            pull_requests="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" | jq -c --arg sha "$EXPECTED_HEAD_SHA" '
              [select(.base.ref == "main" and .state == "open" and .head.sha == $sha) | {
                number,
                head: {sha: .head.sha, ref: .head.ref, repo: .head.repo.full_name}
              }]
            ')"
          else
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            base_branch="${BASE_REF#refs/heads/}"
            pull_requests="$(
              gh api graphql \
                -f owner="$owner" \
                -f name="$name" \
                -f branch="$base_branch" \
                -f query='query($owner: String!, $name: String!, $branch: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: $branch) {
                    entries(first: 100) {
                      nodes {
                        headCommit { oid }
                        pullRequest {
                          number
                          headRefOid
                          headRefName
                          headRepository { nameWithOwner }
                          baseRefName
                        }
                      }
                    }
                  }
                }
              }' | jq -c --arg sha "$SHA" --arg base "$base_branch" '
                .data.repository.mergeQueue.entries.nodes
                | map(select(
                    .headCommit.oid == $sha
                    and .pullRequest.baseRefName == $base
                  ) | {
                    number: .pullRequest.number,
                    head: {
                      sha: .pullRequest.headRefOid,
                      ref: .pullRequest.headRefName,
                      repo: .pullRequest.headRepository.nameWithOwner
                    }
                  })
              ')"
          fi

          if [ "$(jq 'length' <<< "$pull_requests")" -eq 0 ]; then
            echo "::error::No main-branch pull request is associated with $SHA."
            exit 1
          fi

          failed=0
          while IFS=$'\t' read -r pr_number head_sha head_ref head_repo; do
            if [ -z "$head_sha" ] || [ "$head_sha" = null ]; then
              echo "::error::PR #${pr_number} has no head SHA."
              failed=1
              continue
            fi
            runs="$(
              gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&per_page=100"
            )"
            run="$(python3 .dev-hermit-policy/ci-hub/check_outcome.py \
              --select-latest-run --head-sha "$head_sha" \
              --event pull_request <<< "$runs")"
            status="$(jq -r '.status // "missing"' <<< "$run")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            url="$(jq -r '.html_url // ""' <<< "$run")"
            run_id="$(jq -r '.id // ""' <<< "$run")"
            regular_status=missing
            regular_conclusion=
            host_status=missing
            host_conclusion=
            if [ -n "$run_id" ]; then
              jobs="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100")"
              rollup="$(jq '.jobs' <<< "$jobs" |
                python3 .dev-hermit-policy/ci-hub/check_outcome.py --select-latest-rollup)"
              regular="$(jq '[.[] | select(.name == "Regular tests (GitHub-hosted)")] | first // {}' <<< "$rollup")"
              host="$(jq '[.[] | select(.name == "Host-dependent tests (self-hosted)")] | first // {}' <<< "$rollup")"
              regular_status="$(jq -r '.status // "missing"' <<< "$regular")"
              regular_conclusion="$(jq -r '.conclusion // ""' <<< "$regular")"
              host_status="$(jq -r '.status // "missing"' <<< "$host")"
              host_conclusion="$(jq -r '.conclusion // ""' <<< "$host")"
            fi

            regular_outcome=$(classify_check "$regular_status" "$regular_conclusion")
            host_outcome=$(classify_check "$host_status" "$host_conclusion")
            if [ "$regular_outcome" = FAILED ] || [ "$host_outcome" = FAILED ]; then
              echo "::error::CI FAILED for PR #${pr_number} at $head_sha: regular=$regular_status/${regular_conclusion:-none} host=$host_status/${host_conclusion:-none}: ${url:-no run URL}."
              failed=1
            elif [ "$regular_outcome" = PASSED ] && [ "$host_outcome" = PASSED ]; then
              echo "Both authoritative CI jobs PASSED for PR #${pr_number} at $head_sha: $url"
            else
              echo "CI has NO_RESULT for PR #${pr_number} at $head_sha: regular=$regular_status/${regular_conclusion:-none} host=$host_status/${host_conclusion:-none}; blocking without reporting failure."
              queue_retry "$status" "$run_id" "$pr_number" "$head_sha"
            fi
          done < <(jq -r '
            .[]
            | [.number, .head.sha, .head.ref, .head.repo]
            | @tsv
          ' <<< "$pull_requests")

          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi
          if [ "$no_result" -ne 0 ]; then
            dispatch_no_result
            cancel_no_result_gate
          fi

          echo "Every required leg has a PASSED result."

  # Transition only: mirror registered v2 into the legacy context while branch
  # protection requires both. The reconciler disables this after v2 lands.
  merge-gate-legacy-context:
    name: merge-gate
    needs: merge-gate
    if: always() && vars.REVERIE_MERGE_GATE_LEGACY_CONTEXT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror the registered v2 result during migration
        env:
          V2_RESULT: ${{ needs.merge-gate.result }}
        run: |
          set -euo pipefail
          if [ "$V2_RESULT" != success ]; then
            echo "::error::merge-gate-v2 did not pass (result=${V2_RESULT})."
            exit 1
          fi
          echo "merge-gate-v2 passed; emitting temporary legacy context."
