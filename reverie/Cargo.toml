# @generated by autocargo from //hermetic_infra/reverie:reverie

[package]
name = "reverie-core"
description = "Deterministic user-space syscall and signal interception runtime — the core Reverie process-instrumentation framework."
version = "0.1.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"

# The package is published as `reverie-core`, but the compiled library keeps the
# name `reverie`. This lets every dependent (in-repo crates, Hermit, and the
# standalone backend repos) import it as `reverie` via the Cargo
# `package = "reverie-core"` alias with zero source churn, and keeps the
# in-crate doctests (`use reverie::...`) — which double as public API examples
# for external Tool authors — compiling and idiomatic.
[lib]
name = "reverie"

[dependencies]
addr2line = "0.26.1"
anyhow = "1.0.103"
async-trait = "0.1.86"
bitflags = { version = "2.13.1", features = ["serde", "std"], default-features = false }
byteorder = "1.5"
libc = "0.2.186"
linked-hash-map = { version = "0.5", features = ["serde_impl"] }
memmap2 = "0.9.11"
never-say-never = "6"
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
object = { version = "0.36.7", features = ["read", "write"] }
procfs = "0.18.0"
raw-cpuid = "10.7.0"
reverie-process = { version = "0.1.0", path = "../reverie-process" }
reverie-syscalls = { version = "0.1.0", path = "../reverie-syscalls" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
syscalls = { version = "0.6.18", features = ["serde"] }
thiserror = "2.0.18"
typed-arena = "2"
