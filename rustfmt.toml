# Get help on options with `rustfmt --help=config`
# Please keep these in alphabetical order.
# format_code_in_doc_comments, group_imports, and imports_granularity are
# nightly-only: stable rustfmt warns and ignores them (stable --check still
# passes on this tree), so the nightly CI lane is what enforces them.
edition = "2024"
format_code_in_doc_comments = true
group_imports = "StdExternalCrate"
imports_granularity = "Item"
merge_derives = false
style_edition = "2024"
use_field_init_shorthand = true
