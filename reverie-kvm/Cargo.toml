[package]
name = "reverie-kvm"
description = "KVM-based execution backend for the Reverie instrumentation framework."
version = "0.5.4"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/reverie-kvm"
keywords = ["linux", "instrumentation", "hermit"]
categories = ["development-tools::debugging", "os::linux-apis"]

[features]
default = []
native-test-support = [
    "reverie-kvm-core/native-test-support",
    "reverie-linuxemu/native-test-support",
]

[dependencies]
futures = { version = "0.3.31", features = ["async-await"] }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
# Exactly reverie-ptrace's version; see its pin (https://github.com/rrnewton/reverie/issues/858).
iced-x86 = "=1.21.0"
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
libc = "0.2.186"
perf-event-open-sys = "5.0"
reverie = { version = "0.5.4", path = "../reverie", package = "reverie-core" }
reverie-kvm-core = { version = "0.5.4", path = "../reverie-kvm-core" }
reverie-linuxemu = { version = "0.5.4", path = "../reverie-linuxemu" }
thiserror = "2.0.18"

[dev-dependencies]
io-uring = "0.7.11"
reverie-kvm-core = { version = "0.5.4", path = "../reverie-kvm-core", features = ["test-support"] }
reverie-linuxemu = { version = "0.5.4", path = "../reverie-linuxemu", features = ["test-support"] }
serde = { version = "1.0.219", features = ["derive"] }

# Ordinary-main startup for explicitly broker-routed integration tests.
[[bin]]
name = "reverie-kvm-broker-test-launcher"
path = "../reverie-linuxemu/tests/support/broker_test_launcher.rs"
test = false
bench = false
doc = false
