[package]
name = "reverie-kvm"
description = "KVM-based execution backend for the Reverie instrumentation framework."
version = "0.4.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
build = "build.rs"

[features]
default = []
native-test-support = []

[dependencies]
futures = { version = "0.3.31", features = ["async-await"] }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
libc = "0.2.186"
perf-event-open-sys = "5.0"
reverie = { version = "0.4.0", path = "../reverie", package = "reverie-core" }
thiserror = "2.0.18"

[dev-dependencies]
io-uring = "0.7.11"
serde = { version = "1.0.219", features = ["derive"] }

[build-dependencies]
cc = "1.5.1"
