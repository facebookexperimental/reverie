[package]
name = "reverie-kvm"
description = "KVM-based execution backend for the Reverie instrumentation framework."
version = "0.5.1"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/reverie-kvm"
keywords = ["linux", "instrumentation", "hermit"]
categories = ["development-tools::debugging", "os::linux-apis"]
build = "build.rs"

# `reverie_kvm_scratch_probe` is an opt-in measurement cfg
# (RUSTFLAGS=--cfg reverie_kvm_scratch_probe) that exports uprobe points for
# the Tool-scratch fast path (src/memory.rs); declare it as a known cfg name so
# the build does not warn under `unexpected_cfgs`. The same block is in the
# reverie-kvm target's autocargo cargo_toml_config in ../BUCK, as for the
# `sanitized` cfg of reverie-process; this file carries no @generated header.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(reverie_kvm_scratch_probe)'] }

[features]
default = []
native-test-support = []

[dependencies]
futures = { version = "0.3.31", features = ["async-await"] }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
libc = "0.2.186"
perf-event-open-sys = "5.0"
reverie = { version = "0.5.1", path = "../reverie", package = "reverie-core" }
reverie-kvm-core = { version = "0.5.1", path = "../reverie-kvm-core" }
thiserror = "2.0.18"

[dev-dependencies]
io-uring = "0.7.11"
serde = { version = "1.0.219", features = ["derive"] }

[build-dependencies]
cc = "1.5.1"

# Ordinary-main startup for explicitly broker-routed integration tests.
[[bin]]
name = "reverie-kvm-broker-test-launcher"
path = "tests/support/broker_test_launcher.rs"
test = false
bench = false
doc = false
